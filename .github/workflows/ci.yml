name: Workbench tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vue dependencies
        working-directory: frontend
        run: npm ci
      - name: Check and build Vue frontend
        working-directory: frontend
        run: npm run build
      - name: Test Vue frontend
        working-directory: frontend
        run: npm test
      - name: Install workbench and test tools
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check backend main.py tests
      - name: Test with mocked cloud services and real FFmpeg
        run: python -m pytest -q
